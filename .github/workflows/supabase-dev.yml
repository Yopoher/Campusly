name: Supabase (développement)

# Applique les migrations et la configuration Auth au projet Supabase de développement.
# Les secrets sont lus depuis les secrets du dépôt GitHub : ils ne transitent jamais ailleurs.
# - automatiquement, après validation de la CI, quand supabase/ change sur main ;
# - à la demande (onglet Actions > Supabase (développement) > Run workflow), avec options de préparation.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      include_seed:
        description: "Charger les données fictives de démonstration (école « Ynov Campus Rouen (démo) »)"
        type: boolean
        default: false
      invite_admin_email:
        description: "Adresse à inviter comme super-administrateur (facultatif)"
        type: string
        required: false
      allow_email:
        description: "Adresse à autoriser dans l'école de démonstration, pour tester la connexion (facultatif)"
        type: string
        required: false

concurrency:
  group: supabase-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: gazcgauqohrushpyhbyw
  SUPABASE_URL: https://gazcgauqohrushpyhbyw.supabase.co

jobs:
  deploy:
    name: Migrations et configuration
    # Après la CI : seulement si elle a réussi et si supabase/ a changé (vérifié plus bas).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Vérifier que les secrets sont configurés
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing"; exit 1; fi

      - name: Le dossier supabase/ a-t-il changé ?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^supabase/'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.run == 'true'

      - name: Lier le projet
        if: steps.changes.outputs.run == 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations prévues
        if: steps.changes.outputs.run == 'true'
        run: npx supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les migrations
        if: steps.changes.outputs.run == 'true'
        run: |
          if [ "${{ inputs.include_seed }}" = "true" ]; then
            npx supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
          else
            npx supabase db push --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Appliquer la configuration Auth (code 10 min, hook de création de compte, double authentification)
        if: steps.changes.outputs.run == 'true'
        run: |
          # Les erreurs sont aussi publiées en annotations (lisibles sans télécharger les journaux).
          if ! npx supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes > config-push.log 2>&1; then
            cat config-push.log
            grep -vE "^\s*$" config-push.log | tail -8 | while read -r line; do
              echo "::error title=supabase config push::${line}"
            done
            exit 1
          fi
          cat config-push.log

      - name: Inviter le super-administrateur
        if: inputs.invite_admin_email != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/invite-admin.ts "${{ inputs.invite_admin_email }}"

      - name: Autoriser une adresse dans l'école de démonstration
        if: inputs.allow_email != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/dev-allow-email.ts "${{ inputs.allow_email }}"
